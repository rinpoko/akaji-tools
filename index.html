<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1e1e1e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AKAJI">
  <title>AKAJI TOOLS</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: #1b1b1f; color: #e8e8ee; font: 15px/1.6 "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Apple Color Emoji", "Segoe UI Emoji", sans-serif; }
    body { display: flex; align-items: center; justify-content: center; padding: 16px; }
    form { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 14px; }
    form[hidden] { display: none; }
    img { width: 72px; height: 72px; border-radius: 16px; align-self: center; }
    h1 { margin: 0; font-size: 18px; letter-spacing: .04em; text-align: center; }
    input[type=password] { width: 100%; padding: 12px; font: inherit; font-size: 16px; color: inherit; background: #16161a; border: 1px solid #3a3a44; border-radius: 8px; }
    input[type=password]:focus { outline: none; border-color: #e60012; }
    label { display: flex; align-items: center; gap: 8px; color: #9a9aa8; font-size: 13px; }
    button { min-height: 46px; font: inherit; font-weight: 600; color: #fff; background: #e60012; border: 0; border-radius: 8px; }
    button:disabled { opacity: .55; }
    #msg { min-height: 22px; margin: 0; color: #ff8189; font-size: 13px; text-align: center; }
    .username { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <form id="gate" hidden>
    <img src="icon-192.png" alt="">
    <h1>AKAJI TOOLS</h1>
    <input class="username" type="text" name="username" value="AKAJI TOOLS" autocomplete="username" tabindex="-1" aria-hidden="true">
    <input id="pw" type="password" autocomplete="current-password" placeholder="パスワード" aria-label="パスワード" required>
    <label><input id="remember" type="checkbox" checked> この端末で記憶する</label>
    <button id="open" type="submit">開く</button>
    <p id="msg" role="alert"></p>
  </form>
  <script src="gate.js"></script>
</body>
</html>
